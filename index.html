const winsEl = document.getElementById('wins');
const openWins = new Map();
let zTop = 100, cascade = 0;

function openApp(id){
  const app = APPS[id];
  if(!app) return;
  if(!window.__STATE__.installed.includes(id)){
    toast('⚠️ ' + app.name + ' belum terinstal. Buka App Store.', 'err');
    closeStart();
    return;
  }
  if(openWins.has(id)){
    const w = openWins.get(id);
    w.el.classList.remove('min');
    focusWin(w);
    closeStart();
    renderTasks();
    return;
  }
  const W = Math.min(window.innerWidth - 10, 780);
  const H = Math.min(window.innerHeight - 130, 600);
  const off = (cascade++ % 6) * 12;
  const el = document.createElement('div');
  el.className = 'win';
  el.style.width  = W + 'px';
  el.style.height = H + 'px';
  el.style.left   = Math.max(5, (window.innerWidth - W)/2 - 20 + off) + 'px';
  el.style.top    = Math.max(5, 20 + off) + 'px';
  el.style.zIndex = ++zTop;

  el.innerHTML =
    '<div class="win-head">' +
      '<div class="win-title"><span>' + app.icon + '</span><span>' + app.name + '</span></div>' +
      '<div class="win-btns">' +
        '<button class="wb min">–</button>' +
        '<button class="wb max">▢</button>' +
        '<button class="wb close">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="win-body"></div>';

  winsEl.appendChild(el);
  const win = { id, app, el, body: el.querySelector('.win-body'), max:false };

  el.querySelector('.min').addEventListener('click', e => { e.stopPropagation(); el.classList.add('min'); renderTasks(); });
  el.querySelector('.max').addEventListener('click', e => { e.stopPropagation(); toggleMax(win); });
  el.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeWin(win); });

  const head = el.querySelector('.win-head');
  head.addEventListener('pointerdown', e => {
    if(e.target.closest('.wb')) return;
    focusWin(win);
    if(win.max) return;
    const r = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, ox = r.left, oy = r.top;
    const move = ev => {
      el.style.left = Math.max(-W + 80, Math.min(window.innerWidth - 60, ox + ev.clientX - sx)) + 'px';
      el.style.top  = Math.max(0, Math.min(window.innerHeight - 100, oy + ev.clientY - sy)) + 'px';
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
    e.preventDefault();
  });
  el.addEventListener('pointerdown', () => focusWin(win));

  openWins.set(id, win);
  focusWin(win);
  renderTasks();
  closeStart();

  try{ app.render(win); }
  catch(err){
    win.body.innerHTML = '<div class="ph"><div class="phi">💥</div><h2>Gagal memuat</h2><p>' + err.message + '</p></div>';
  }
}

function focusWin(win){
  win.el.style.zIndex = ++zTop;
  document.querySelectorAll('.tk').forEach(t => t.classList.remove('on'));
  const tk = document.querySelector('.tk[data-id="' + win.id + '"]');
  if(tk) tk.classList.add('on');
}
function closeWin(win){
  win.el.style.animation = 'pop .12s reverse';
  setTimeout(() => {
    win.el.remove();
    openWins.delete(win.id);
    renderTasks();
  }, 110);
}
function toggleMax(win){
  if(!win.max){
    win._rect = { l:win.el.style.left, t:win.el.style.top, w:win.el.style.width, h:win.el.style.height };
    win.el.classList.add('max');
    win.el.style.left = '0px';
    win.el.style.top = '0px';
    win.el.style.width = window.innerWidth + 'px';
    win.el.style.height = (window.innerHeight - 56) + 'px';
    win.max = true;
  } else {
    win.el.classList.remove('max');
    const r = win._rect || {};
    win.el.style.left = r.l || '20px';
    win.el.style.top = r.t || '30px';
    win.el.style.width = r.w || '320px';
    win.el.style.height = r.h || '400px';
    win.max = false;
  }
}
function renderTasks(){
  const box = document.getElementById('tasks');
  box.innerHTML = '';
  openWins.forEach(w => {
    const b = document.createElement('button');
    b.className = 'tk' + (w.el.classList.contains('min') ? '' : ' on');
    b.dataset.id = w.id;
    b.innerHTML = '<span>' + w.app.icon + '</span><span>' + w.app.name + '</span>';
    b.addEventListener('click', () => {
      if(w.el.classList.contains('min')){ w.el.classList.remove('min'); focusWin(w); }
      else { w.el.classList.add('min'); b.classList.remove('on'); }
      renderTasks();
    });
    box.appendChild(b);
  });
}

function renderTerminal(win){
  win.body.innerHTML =
    '<div class="term-wrap">' +
      '<div class="term-toolbar">' +
        '<button data-insert="help">help</button>' +
        '<button data-insert="ls -la">ls -la</button>' +
        '<button data-insert="neofetch">neofetch</button>' +
        '<button data-insert="python3">python3</button>' +
        '<button data-insert="apt list --installed">apt list</button>' +
        '<button data-insert="cat selamat-datang.txt">cat welcome</button>' +
        '<button data-clear="1">clear</button>' +
      '</div>' +
      '<div class="term-scroll"><div class="term-out"></div>' +
        '<div class="term-line">' +
          '<span class="term-prompt"></span>' +
          '<input class="term-in" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '</div>' +
      '</div>' +
    '</div>';

  const scroll = win.body.querySelector('.term-scroll');
  const out    = win.body.querySelector('.term-out');
  const inp    = win.body.querySelector('.term-in');
  const prompt = win.body.querySelector('.term-prompt');

  const shell = new Shell({ clear: () => { out.innerHTML = ''; } });
  const history = shell.history;
  let hIdx = 0;

  function refreshPrompt(){
    prompt.innerHTML = ansiToHtml(shell.prompt());
  }

  function print(text){
    const d = document.createElement('div');
    d.className = 'term-out';
    d.innerHTML = ansiToHtml(text);
    out.appendChild(d);
    scroll.scrollTop = scroll.scrollHeight;
  }

  refreshPrompt();
  print('\x1b[1;36m╔══════════════════════════════════════════════════════╗\x1b[0m');
  print('\x1b[1;36m║          WEBLINUX PRO — Terminal v2.0                ║\x1b[0m');
  print('\x1b[1;36m╚══════════════════════════════════════════════════════╝\x1b[0m');
  print('');
  print('\x1b[1;33mKetik \x1b[1;32mhelp\x1b[1;33m untuk melihat perintah. Ketik \x1b[1;32mpython3\x1b[1;33m untuk Python asli.\x1b[0m');
  print('');

  async function submit(cmd){
    const c = cmd.trim();
    if(c){
      history.push(c);
      hIdx = history.length;
    }
    print(shell.prompt() + c);
    if(!c) return;
    const tmpWin = { body: document.createElement('div') };
    try{
      /* Execute with capture, then print */
      const captured = { text: '' };
      const origExec = shell.executeInternal.bind(shell);
      /* Redirect output to us */
      const capture = { write: s => { captured.text += s; } };
      await shell.executeInternal(c, { capture });
      if(captured.text) print(captured.text);
    }catch(e){
      print('\x1b[31m' + e.message + '\x1b[0m');
    }
    refreshPrompt();
  }

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const v = inp.value;
      inp.value = '';
      submit(v);
      e.preventDefault();
    } else if(e.key === 'ArrowUp'){
      if(hIdx > 0){ hIdx--; inp.value = history[hIdx] || ''; }
      e.preventDefault();
    } else if(e.key === 'ArrowDown'){
      if(hIdx < history.length - 1){ hIdx++; inp.value = history[hIdx] || ''; }
      else { hIdx = history.length; inp.value = ''; }
      e.preventDefault();
    } else if(e.key === 'Tab'){
      e.preventDefault();
      const v = inp.value;
      const parts = v.split(/\s+/);
      const last = parts[parts.length - 1] || '';
      const cmds = Object.keys(C).filter(k => k.startsWith(last));
      if(cmds.length === 1){
        parts[parts.length - 1] = cmds[0];
        inp.value = parts.join(' ');
      } else if(cmds.length > 1){
        print(cmds.join('   '));
      } else {
        /* file completion */
        const dir = last.includes('/') ? last.slice(0, last.lastIndexOf('/')+1) : '';
        const base = last.slice(last.lastIndexOf('/')+1);
        const absDir = VFS.resolve(dir || '.', shell.cwd);
        if(VFS.isDir(absDir)){
          const entries = Object.keys(VFS.get(absDir).c).filter(n => n.startsWith(base));
          if(entries.length === 1){
            parts[parts.length - 1] = dir + entries[0];
            inp.value = parts.join(' ');
          } else if(entries.length > 1){
            print(entries.join('   '));
          }
        }
      }
    } else if(e.key === 'l' && e.ctrlKey){
      out.innerHTML = '';
      refreshPrompt();
      e.preventDefault();
    } else if(e.key === 'c' && e.ctrlKey){
      inp.value = '';
      print('^C');
      refreshPrompt();
      e.preventDefault();
    }
  });

  win.body.querySelector('.term-scroll').addEventListener('click', () => inp.focus());
  win.body.querySelectorAll('.term-toolbar button').forEach(b => {
    b.addEventListener('click', () => {
      if(b.dataset.clear){ out.innerHTML = ''; refreshPrompt(); return; }
      inp.value = b.dataset.insert || '';
      inp.focus();
    });
  });

  setTimeout(() => inp.focus(), 300);
}

function renderFiles(win){
  let path = '/home/' + window.__STATE__.user;
  win.body.innerHTML =
    '<div class="fm">' +
      '<div class="fm-toolbar">' +
        '<button class="fm-btn" data-act="up">⬆</button>' +
        '<button class="fm-btn" data-act="home">🏠</button>' +
        '<div class="fm-path"></div>' +
        '<button class="fm-btn" data-act="refresh">🔄</button>' +
      '</div>' +
      '<div class="fm-list"></div>' +
    '</div>';
  const pEl = win.body.querySelector('.fm-path');
  const lEl = win.body.querySelector('.fm-list');

  function draw(){
    pEl.textContent = path;
    lEl.innerHTML = '';
    const entries = VFS.list(path);
    if(entries.err){ lEl.innerHTML = '<div class="fm-empty">Tidak dapat membuka direktori</div>'; return; }
    const list = entries.entries.sort((a, b) => {
      if(a.t !== b.t) return a.t === 'd' ? -1 : 1;
      return a.n.localeCompare(b.n);
    });
    if(path !== '/'){
      const up = document.createElement('div');
      up.className = 'fm-item';
      up.innerHTML = '<span class="fi">↩️</span><span class="fn">..</span>';
      up.addEventListener('click', () => { path = VFS.parent(path); draw(); });
      lEl.appendChild(up);
    }
    if(!list.length){
      const d = document.createElement('div');
      d.className = 'fm-empty';
      d.textContent = 'Folder kosong';
      lEl.appendChild(d);
      return;
    }
    list.forEach(item => {
      const d = document.createElement('div');
      d.className = 'fm-item';
      const icon = item.t === 'd' ? '📁' : guessIcon(item.n);
      d.innerHTML = '<span class="fi">' + icon + '</span><span class="fn">' + item.n + '</span>' +
                    '<span class="fm">' + (item.t === 'd' ? 'DIR' : humanSize(item.c.length)) + '</span>';
      d.addEventListener('click', () => {
        if(item.t === 'd'){ path = (path === '/' ? '' : path) + '/' + item.n; draw(); }
        else {
          state.notes['__open'] = { path:(path === '/' ? '' : path) + '/' + item.n, content:item.c };
          openApp('editor');
          setTimeout(() => {
            const w = openWins.get('editor');
            if(w && w._loadFile) w._loadFile((path === '/' ? '' : path) + '/' + item.n, item.c);
          }, 200);
        }
      });
      lEl.appendChild(d);
    });
  }
  function guessIcon(name){
    if(/\.(py)$/i.test(name)) return '🐍';
    if(/\.(js|ts)$/i.test(name)) return '📜';
    if(/\.(json)$/i.test(name)) return '🧾';
    if(/\.(md|txt)$/i.test(name)) return '📄';
    if(/\.(sh|bash)$/i.test(name)) return '🐚';
    if(/\.(html|htm)$/i.test(name)) return '🌐';
    if(/\.(css)$/i.test(name)) return '🎨';
    if(/\.(jpg|png|gif|webp)$/i.test(name)) return '🖼️';
    return '📄';
  }
  win.body.querySelector('[data-act="up"]').addEventListener('click', () => { if(path !== '/'){ path = VFS.parent(path); draw(); } });
  win.body.querySelector('[data-act="home"]').addEventListener('click', () => { path = '/home/' + window.__STATE__.user; draw(); });
  win.body.querySelector('[data-act="refresh"]').addEventListener('click', draw);
  draw();
}

function renderCalc(win){
  win.body.innerHTML = '<div class="calc"><div class="calc-disp">0</div><div class="calc-grid"></div></div>';
  const disp = win.body.querySelector('.calc-disp');
  const grid = win.body.querySelector('.calc-grid');
  const keys = [
    ['C','fn'],['⌫','fn'],['%','op'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['±',''],['0',''],['.',''],['=','eq']
  ];
  let cur = '0', prev = null, op = null, reset = false;
  function upd(){ disp.textContent = cur.length > 12 ? Number(cur).toExponential(6) : cur; }
  function calc(a, b, o){
    a = parseFloat(a); b = parseFloat(b);
    if(o === '+') return a + b;
    if(o === '−') return a - b;
    if(o === '×') return a * b;
    if(o === '÷') return b === 0 ? NaN : a / b;
    if(o === '%') return a % b;
    return b;
  }
  keys.forEach(([k, cls]) => {
    const b = document.createElement('button');
    b.textContent = k;
    if(cls) b.className = cls;
    b.addEventListener('click', () => {
      if(k >= '0' && k <= '9'){ if(reset || cur === '0'){ cur = k; reset = false; } else cur += k; }
      else if(k === '.'){ if(reset){ cur = '0.'; reset = false; } else if(!cur.includes('.')) cur += '.'; }
      else if(k === 'C'){ cur = '0'; prev = null; op = null; reset = false; }
      else if(k === '⌫'){ cur = cur.length > 1 ? cur.slice(0,-1) : '0'; }
      else if(k === '±'){ cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
      else if(k === '='){
        if(op && prev !== null){
          const r = calc(prev, cur, op);
          cur = isNaN(r) ? 'Error' : String(Math.round(r * 1e10) / 1e10);
          prev = null; op = null; reset = true;
        }
      } else {
        if(op && prev !== null && !reset){
          const r = calc(prev, cur, op);
          cur = isNaN(r) ? 'Error' : String(Math.round(r * 1e10) / 1e10);
        }
        prev = cur; op = k; reset = true;
      }
      upd();
    });
    grid.appendChild(b);
  });
  upd();
}

   ===================================================================== */
function renderPython(win){
  win.body.innerHTML =
    '<div class="repl">' +
      '<div class="repl-out"></div>' +
      '<div class="repl-line">' +
        '<span class="repl-prompt">>>> </span>' +
        '<textarea class="repl-in" rows="1" placeholder="Ketik kode Python..." spellcheck="false"></textarea>' +
      '</div>' +
    '</div>';
  const out = win.body.querySelector('.repl-out');
  const inp = win.body.querySelector('.repl-in');
  const prm = win.body.querySelector('.repl-prompt');

  function print(t, cls){
    const d = document.createElement('div');
    if(cls) d.className = cls;
    d.textContent = t;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }

  print('Python 3.12 (Pyodide WASM)');
  print('Ketik kode Python. Kosongkan 2x untuk menjalankan blok.');
  print('');

  let buf = [];
  let emptyCount = 0;

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      const line = inp.value;
      inp.value = '';
      inp.style.height = '22px';
      if(!line.trim()){
        emptyCount++;
        if(emptyCount >= 2 && buf.length){
          run(buf.join('\n'));
          buf = [];
          emptyCount = 0;
          prm.textContent = '>>> ';
        } else if(!buf.length){
          emptyCount = 0;
        }
        return;
      }
      emptyCount = 0;
      buf.push(line);
      prm.textContent = '... ';
      if(!/[:\\{(]$/.test(line.trim()) && !/^\s/.test(line)){
        run(buf.join('\n'));
        buf = [];
        prm.textContent = '>>> ';
      }
    }
  });

  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });

  async function run(code){
    print('>>> ' + code, 'ansi-dim');
    const loading = document.getElementById('loading');
    const ltxt = document.getElementById('ltxt');
    const firstTime = !window.__pyodide;
    if(loading){
      loading.classList.add('on');
      ltxt.textContent = firstTime ? 'Mengunduh Python 3 (sekali saja, ~12 MB)...' : 'Menjalankan...';
    }
    try{
      const py = await ensurePyodide();
      if(loading) loading.classList.remove('on');
      let output = '';
      py.setStdout({ batched: s => { output += s + '\n'; } });
      py.setStderr({ batched: s => { output += s + '\n'; } });
      try{
        const result = await py.runPythonAsync(code);
        if(result !== undefined && result !== null) output += String(result) + '\n';
      }catch(e){
        output += (e.message || String(e)) + '\n';
      }
      if(output) print(output);
    }catch(e){
      if(loading) loading.classList.remove('on');
      print('Error memuat Python: ' + e.message);
    }
  }
  setTimeout(() => inp.focus(), 200);
}

      print('> ' + code);
      const logs = [];

      function fmt(x){ try{ return typeof x === 'object' ? JSON.stringify(x) : String(x); }catch(e){ return String(x); } }
      try{
        const fn = new Function('console', 'return (function(){ ' + code + ' })()');
        const r = fn(fakeConsole);
        if(r !== undefined) logs.push('=> ' + fmt(r));
        if(logs.length) print(logs.join('\n'));
      }catch(e){ print('Error: ' + e.message); }
    }
  });

    catch(e){ toast('Tidak dapat membuka', 'err'); }
  }
  win.body.querySelector('#goBtn').addEventListener('click', () => go(urlBar.value.trim()));
  urlBar.addEventListener('keydown', e => { if(e.key === 'Enter') go(urlBar.value.trim()); });
  win.body.querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => go(b.dataset.u)));
}

/* =====================================================================
   24. PLACEHOLDER
   ===================================================================== */
function makePh(win){
  const app = win.app;
  win.body.innerHTML =
    '<div class="ph">' +
      '<div class="phi">' + app.icon + '</div>' +
      '<h2>' + app.name + '</h2>' +
      '<p>' + app.desc + '</p>' +
      '<p class="pkg-info">paket: ' + (app.pkg || win.id) + '</p>' +
      '<button class="btn" id="phRun" style="margin-top:6px">▶ Jalankan</button>' +
      '<button class="btn gray" id="phRm">Hapus</button>' +
    '</div>';
  win.body.querySelector('#phRun').addEventListener('click', () => {
    if(app.cmd){
      openApp('terminal');
      setTimeout(() => {
        const tw = openWins.get('terminal');
        if(tw){ const inp = tw.body.querySelector('.term-in'); if(inp){ inp.value = app.cmd + ' "Halo Linux"'; inp.focus(); } }
      }, 300);
    } else {
      toast('✅ ' + app.name + ' berjalan (mode demo)', 'ok');
    }
  });
  win.body.querySelector('#phRm').addEventListener('click', () => {
    if(app.core) return;
    if(confirm('Hapus ' + app.name + '?')){
      window.__STATE__.installed = window.__STATE__.installed.filter(x => x !== win.id);
      saveState();
      renderIcons();
      renderStart('');
      closeWin(win);
      toast('🗑️ ' + app.name + ' dihapus');
    }
  });
}

/* =====================================================================
   25. EVENT & INIT
   ===================================================================== */
document.getElementById('startBtn').addEventListener('click', toggleStart);
document.getElementById('smSearch').addEventListener('input', e => renderStart(e.target.value));
document.getElementById('smLock').addEventListener('click', () => { closeStart(); toast('🔒 Layar dikunci (demo)'); });
document.getElementById('smPower').addEventListener('click', () => {
  closeStart();
  if(confirm('Matikan WebLinux Pro?')){
    document.getElementById('boot').style.display = 'flex';
    document.getElementById('boot').classList.remove('hide');
    setTimeout(() => location.reload(), 800);
  }
});
document.getElementById('desktop').addEventListener('pointerdown', e => {
  if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) closeStart();
});

const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function tick(){
  const d = new Date();
  document.getElementById('time').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  document.getElementById('date').textContent = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()];
}
setInterval(tick, 1000); tick();

/* Back button */
history.pushState({}, '');
window.addEventListener('popstate', () => {
  if(document.getElementById('startMenu').classList.contains('on')) closeStart();
  else if(openWins.size){ const last = Array.from(openWins.values()).pop(); closeWin(last); }
  history.pushState({}, '');
});

/* Boot */
const bootLines = [
  'Menginisialisasi kernel virtual...',
  'Memuat modul WASM...',
  'Memasang sistem berkas...',
  'Menjalankan init...',
  'Mempersiapkan shell...',
  'Siap!'
];
let bootIdx = 0;
const bootInterval = setInterval(() => {
  bootIdx++;
  if(bootIdx < bootLines.length){
    document.getElementById('bootTxt').textContent = bootLines[bootIdx];
  }
}, 350);

setTimeout(() => {
  clearInterval(bootInterval);
  document.getElementById('boot').classList.add('hide');
  setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 600);
  document.getElementById('desktop').classList.add('on');
  applyTheme();
  renderIcons();
  renderStart('');
  renderTasks();
  setTimeout(() => toast('👋 Selamat datang di WebLinux Pro! Ketuk ⊞ untuk mulai.', 'ok'), 600);
  setTimeout(() => toast('💡 Buka Terminal → ketik "help" atau "python3"', 'ok'), 2800);
}, 2200);
</script>
